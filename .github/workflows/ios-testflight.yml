# Builds the StormCheck Pro iPhone app on a GitHub-hosted Mac and uploads it
# to TestFlight. No Mac needed: run it from GitHub → Actions → "iOS → TestFlight"
# → Run workflow (works from the GitHub iPhone app too).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID       10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID          App Store Connect API key ID (Users and Access → Integrations → Team Keys, role: Admin)
#   ASC_ISSUER_ID       Issuer ID shown above that key list
#   ASC_KEY_P8          full text of the downloaded AuthKey_XXXX.p8 file
name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version shown in the App Store (e.g. 1.0)'
        required: true
        default: '1.0'
      mode:
        description: 'build = build and upload; status = only report Apple processing status'
        required: false
        default: 'build'

concurrency: ios-testflight

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        run: npm ci

      - name: Sync native project
        run: npx cap sync ios

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for n in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s):$missing — add them in Settings → Secrets and variables → Actions (names must match exactly)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          # Rebuild the PEM so pasted line breaks / spaces don't matter.
          body=$(printf '%s' "$ASC_KEY_P8" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \r\n\t')
          len=${#body}
          echo "Key body length: $len characters (expected about 200)"
          if [ "$len" -lt 150 ]; then echo "::error::ASC_KEY_P8 looks cut off ($len characters). Paste the whole .p8 file text."; exit 1; fi
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$body" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          if ! openssl pkey -in "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 is not a valid key. Re-copy it from the .p8 file in Notepad (Ctrl+A, Ctrl+C)."; exit 1
          fi
          echo "Key OK"
          case "$APPLE_TEAM_ID" in
            [A-Z0-9][A-Z0-9][A-Z0-9][A-Z0-9][A-Z0-9][A-Z0-9][A-Z0-9][A-Z0-9][A-Z0-9][A-Z0-9]) echo "Team ID format OK" ;;
            *) echo "::error::APPLE_TEAM_ID should be exactly 10 capital letters/numbers from developer.apple.com → Membership details (got ${#APPLE_TEAM_ID} characters)"; exit 1 ;;
          esac
          # Ask Apple whether this key works and can see the app.
          KEYFILE="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          TOKEN=$(KEYFILE="$KEYFILE" node -e '
            const c=require("crypto"),fs=require("fs");
            const u=o=>Buffer.from(JSON.stringify(o)).toString("base64url");
            const now=Math.floor(Date.now()/1000);
            const d=u({alg:"ES256",kid:process.env.ASC_KEY_ID,typ:"JWT"})+"."+u({iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+600,aud:"appstoreconnect-v1"});
            const sig=c.sign("sha256",Buffer.from(d),{key:fs.readFileSync(process.env.KEYFILE),dsaEncoding:"ieee-p1363"}).toString("base64url");
            process.stdout.write(d+"."+sig)')
          code=$(curl -s -o /tmp/asc.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://api.appstoreconnect.apple.com/v1/bundleIds?filter%5Bidentifier%5D=com.thepublicadjustertx.stormcheckpro&limit=5")
          echo "App Store Connect API check: HTTP $code"
          if [ "$code" = "401" ]; then echo "::error::Apple rejected the key: ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 don't belong together. Re-copy the Key ID and Issuer ID for the key you pasted."; exit 1; fi
          if [ "$code" = "403" ]; then echo "::error::The key works but lacks permission. In App Store Connect → Integrations, make a key with Access = Admin."; exit 1; fi
          SEED=$(python3 -c "import json;d=json.load(open('/tmp/asc.json'));print((d.get('data') or [{}])[0].get('attributes',{}).get('seedId',''))" || true)
          echo "App ID registered: $([ -n "$SEED" ] && echo yes || echo no)"
          if [ -n "$SEED" ] && [ "$SEED" != "$APPLE_TEAM_ID" ]; then
            echo "::error::APPLE_TEAM_ID doesn't match your Apple team. It should be $SEED (developer.apple.com → Membership details → Team ID)."; exit 1
          fi
          echo "Team ID matches the key's team"

      - name: Apple processing status
        if: inputs.mode == 'status'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: com.thepublicadjustertx.stormcheckpro
        run: ASC_KEY_FILE="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" node ci/asc-signing.js status

      - name: App Store certificate + profile
        if: inputs.mode != 'status'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: com.thepublicadjustertx.stormcheckpro
          PROFILE_NAME: StormCheck Pro CI
        run: |
          export ASC_KEY_FILE="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          SIGN="$RUNNER_TEMP/sign"
          node ci/asc-signing.js setup "$SIGN"
          # Temporary keychain holding the new distribution identity.
          KC="$RUNNER_TEMP/ci.keychain-db"; KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          openssl x509 -inform DER -in "$SIGN/cert.cer" -out "$SIGN/cert.pem"
          P12PW=$(openssl rand -hex 16)
          openssl pkcs12 -export -legacy -inkey "$SIGN/key.pem" -in "$SIGN/cert.pem" -out "$SIGN/id.p12" -passout pass:"$P12PW" 2>/dev/null \
            || openssl pkcs12 -export -inkey "$SIGN/key.pem" -in "$SIGN/cert.pem" -out "$SIGN/id.p12" -passout pass:"$P12PW"
          security import "$SIGN/id.p12" -k "$KC" -P "$P12PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          UUID=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1])).profileUuid)' "$SIGN/state.json")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$SIGN/profile.mobileprovision" "$d/$UUID.mobileprovision"
          done

      - name: Archive
        if: inputs.mode != 'status'
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive 2>&1 | tail -60

      - name: Upload to TestFlight
        if: inputs.mode != 'status'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>P526XB7F78</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.thepublicadjustertx.stormcheckpro</key><string>StormCheck Pro CI</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          echo "Uploaded build ${{ github.run_number }} (version ${{ inputs.version }}). It shows up in TestFlight after Apple finishes processing (usually 5–30 minutes)."

      - name: Clean up certificate, profile and key
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_FILE="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          [ -f "$ASC_KEY_FILE" ] && node ci/asc-signing.js cleanup "$RUNNER_TEMP/sign" || true
          security delete-keychain "$RUNNER_TEMP/ci.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/sign"
