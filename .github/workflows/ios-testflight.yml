# Builds the StormCheck Pro iPhone app on a GitHub-hosted Mac and uploads it
# to TestFlight. No Mac needed: run it from GitHub → Actions → "iOS → TestFlight"
# → Run workflow (works from the GitHub iPhone app too).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID       10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID          App Store Connect API key ID (Users and Access → Integrations → Team Keys, role: Admin)
#   ASC_ISSUER_ID       Issuer ID shown above that key list
#   ASC_KEY_P8          full text of the downloaded AuthKey_XXXX.p8 file
name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version shown in the App Store (e.g. 1.0)'
        required: true
        default: '1.0'

concurrency: ios-testflight

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        run: npm ci

      - name: Sync native project
        run: npx cap sync ios

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for n in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s):$missing — add them in Settings → Secrets and variables → Actions (names must match exactly)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          # Rebuild the PEM so pasted line breaks / spaces don't matter.
          body=$(printf '%s' "$ASC_KEY_P8" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \r\n\t')
          len=${#body}
          echo "Key body length: $len characters (expected about 200)"
          if [ "$len" -lt 150 ]; then echo "::error::ASC_KEY_P8 looks cut off ($len characters). Paste the whole .p8 file text."; exit 1; fi
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$body" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          if ! openssl pkey -in "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 is not a valid key. Re-copy it from the .p8 file in Notepad (Ctrl+A, Ctrl+C)."; exit 1
          fi
          echo "Key OK"
          case "$APPLE_TEAM_ID" in
            [A-Z0-9][A-Z0-9][A-Z0-9][A-Z0-9][A-Z0-9][A-Z0-9][A-Z0-9][A-Z0-9][A-Z0-9][A-Z0-9]) echo "Team ID format OK" ;;
            *) echo "::error::APPLE_TEAM_ID should be exactly 10 capital letters/numbers from developer.apple.com → Membership details (got ${#APPLE_TEAM_ID} characters)"; exit 1 ;;
          esac
          # Ask Apple whether this key works and can see the app.
          KEYFILE="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          TOKEN=$(KEYFILE="$KEYFILE" node -e '
            const c=require("crypto"),fs=require("fs");
            const u=o=>Buffer.from(JSON.stringify(o)).toString("base64url");
            const now=Math.floor(Date.now()/1000);
            const d=u({alg:"ES256",kid:process.env.ASC_KEY_ID,typ:"JWT"})+"."+u({iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+600,aud:"appstoreconnect-v1"});
            const sig=c.sign("sha256",Buffer.from(d),{key:fs.readFileSync(process.env.KEYFILE),dsaEncoding:"ieee-p1363"}).toString("base64url");
            process.stdout.write(d+"."+sig)')
          code=$(curl -s -o /tmp/asc.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://api.appstoreconnect.apple.com/v1/bundleIds?filter%5Bidentifier%5D=com.thepublicadjustertx.stormcheckpro&limit=5")
          echo "App Store Connect API check: HTTP $code"
          if [ "$code" = "401" ]; then echo "::error::Apple rejected the key: ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 don't belong together. Re-copy the Key ID and Issuer ID for the key you pasted."; exit 1; fi
          if [ "$code" = "403" ]; then echo "::error::The key works but lacks permission. In App Store Connect → Integrations, make a key with Access = Admin."; exit 1; fi
          SEED=$(python3 -c "import json;d=json.load(open('/tmp/asc.json'));print((d.get('data') or [{}])[0].get('attributes',{}).get('seedId',''))" || true)
          echo "App ID registered: $([ -n "$SEED" ] && echo yes || echo no)"
          if [ -n "$SEED" ] && [ "$SEED" != "$APPLE_TEAM_ID" ]; then
            echo "::error::APPLE_TEAM_ID doesn't match your Apple team. It should be $SEED (developer.apple.com → Membership details → Team ID)."; exit 1
          fi
          echo "Team ID matches the key's team"

      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -40

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          echo "Uploaded build ${{ github.run_number }} (version ${{ inputs.version }}). It shows up in TestFlight after Apple finishes processing (usually 5–30 minutes)."

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
