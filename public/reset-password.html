<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#172235"><link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — StormCheck Pro</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { background: var(--navy); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .wrap { width: 100%; max-width: 420px; }
    .logo { text-align: center; margin-bottom: 24px; }
    .brand { font-size: 1.5em; font-weight: 900; color: white; }
    .brand span { color: var(--gold); }
    .card { background: white; border-radius: 12px; padding: 32px; }
    .card h2 { font-size: 1.2em; margin-bottom: 8px; color: var(--navy); }
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo"><div class="brand">Storm<span>Check</span> Pro</div></div>
  <div class="card">
    <h2>Set New Password</h2>
    <div id="msg" style="display:none" class="alert"></div>
    <form id="resetForm">
      <div class="form-group">
        <label>New Password (min 8 characters)</label>
        <input type="password" id="password" placeholder="••••••••" required minlength="8">
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="confirm" placeholder="••••••••" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Set New Password</button>
    </form>
  </div>
</div>
<script>
const token = new URLSearchParams(location.search).get('token');
if (!token) window.location = '/login';

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pwd = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  msg.style.display = 'none';

  if (pwd !== confirm) {
    msg.className = 'alert alert-error';
    msg.textContent = 'Passwords do not match.';
    msg.style.display = 'block';
    return;
  }

  btn.textContent = 'Saving...'; btn.disabled = true;
  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pwd })
    });
    const data = await res.json();
    if (data.success) {
      msg.className = 'alert alert-success';
      msg.textContent = 'Password updated! Redirecting to login...';
      msg.style.display = 'block';
      setTimeout(() => window.location = '/login', 2000);
    } else {
      msg.className = 'alert alert-error';
      msg.textContent = data.error || 'Reset failed. The link may have expired.';
      msg.style.display = 'block';
      btn.textContent = 'Set New Password'; btn.disabled = false;
    }
  } catch (err) {
    msg.className = 'alert alert-error';
    msg.textContent = 'Error. Try again or contact (817) 618-9884.';
    msg.style.display = 'block';
    btn.textContent = 'Set New Password'; btn.disabled = false;
  }
});
</script>
</body>
</html>
