<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#172235"><link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — StormCheck Pro</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { background: var(--navy); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .wrap { width: 100%; max-width: 420px; }
    .logo { text-align: center; margin-bottom: 24px; }
    .brand { font-size: 1.5em; font-weight: 900; color: white; }
    .brand span { color: var(--gold); }
    .card { background: white; border-radius: 12px; padding: 32px; }
    .card h2 { font-size: 1.2em; margin-bottom: 8px; color: var(--navy); }
    .card p { color: var(--muted); font-size: 0.9em; margin-bottom: 20px; }
    .footer { text-align: center; margin-top: 16px; font-size: 0.88em; color: rgba(255,255,255,0.6); }
    .footer a { color: var(--gold); text-decoration: none; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="brand">Storm<span>Check</span> Pro</div>
  </div>
  <div class="card">
    <h2>Reset Your Password</h2>
    <p>Enter your email address and we'll send you a link to reset your password.</p>
    <div id="msg" style="display:none" class="alert"></div>
    <form id="forgotForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@company.com" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send Reset Link</button>
    </form>
  </div>
  <div class="footer"><a href="/login">← Back to login</a></div>
</div>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  msg.style.display = 'none';
  btn.textContent = 'Sending...'; btn.disabled = true;
  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value })
    });
    // Always show success to prevent email enumeration
    msg.className = 'alert alert-success';
    msg.textContent = 'If an account exists for that email, a reset link has been sent. Check your inbox.';
    msg.style.display = 'block';
    btn.textContent = 'Sent!';
  } catch (err) {
    msg.className = 'alert alert-error';
    msg.textContent = 'Something went wrong. Try again or call (817) 618-9884.';
    msg.style.display = 'block';
    btn.textContent = 'Send Reset Link'; btn.disabled = false;
  }
});
</script>
</body>
</html>
