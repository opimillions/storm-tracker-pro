<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#172235"><link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — StormCheck Pro</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { background: var(--navy); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .register-wrap { width: 100%; max-width: 460px; }
    .login-logo { text-align: center; margin-bottom: 24px; }
    .login-logo .brand { font-size: 1.5em; font-weight: 900; color: white; }
    .login-logo .brand span { color: var(--gold); }
    .login-logo .sub { color: rgba(255,255,255,0.6); font-size: 0.88em; margin-top: 4px; }
    .register-card { background: white; border-radius: 12px; padding: 32px; }
    .register-card h2 { font-size: 1.3em; margin-bottom: 6px; color: var(--navy); }
    .register-card .trial-badge { background: #fef3c7; color: #92400e; padding: 6px 14px; border-radius: 20px; font-size: 0.82em; font-weight: 700; display: inline-block; margin-bottom: 20px; }
    .login-footer { text-align: center; margin-top: 16px; font-size: 0.88em; color: rgba(255,255,255,0.6); }
    .login-footer a { color: var(--gold); text-decoration: none; }
    .trial-info { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 7px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.85em; color: #166534; }
  </style>
  <script src="/js/tracking.js" async></script>
</head>
<body>
<div class="register-wrap">
  <div class="login-logo">
    <div class="brand">Storm<span>Check</span> Pro</div>
    <div class="sub">Powered by First Call Public Adjusters</div>
  </div>

  <div class="register-card">
    <h2>Create Your Account</h2>
    <span class="trial-badge" id="trialBadge">1 Free Hail Report — No Credit Card</span>

    <div class="trial-info" id="partnerInfo" style="display:none"></div>
    <div class="trial-info" id="trialInfo">
      ✅ No credit card required<br>
      ✅ 1 free hail history report included<br>
      ✅ Upgrade to Pro for unlimited lookups ($79/mo)
    </div>

    <div id="errorMsg" class="alert alert-error" style="display:none"></div>

    <form id="registerForm">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="name" placeholder="John Smith" required>
      </div>
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" id="company" placeholder="Smith Roofing LLC">
      </div>
      <div class="form-group">
        <label>Mobile phone <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
        <input type="tel" id="phone" placeholder="(817) 555-0100" autocomplete="tel">
      </div>
      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" id="email" placeholder="you@company.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password * (min 8 characters)</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="new-password" minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="regBtn">Create Free Account</button>
    </form>
  </div>

  <div class="login-footer">
    Already have an account? <a href="/login">Sign in</a>
  </div>
</div>

<script>
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    const errEl = document.getElementById('errorMsg');
    errEl.style.display = 'none';
    btn.innerHTML = '<span class="spinner"></span> Creating account...';
    btn.disabled = true;

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value,
          company: document.getElementById('company').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          phone: document.getElementById('phone').value,
          invite: inviteCode || undefined,
        })
      });
      const data = await res.json();
      if (data.success) {
        if (window.scpTrack) window.scpTrack('signup');
        setTimeout(function () { window.location = data.redirect; }, window.scpTrack ? 400 : 0);
        return;
      } else {
        errEl.textContent = data.error;
        errEl.style.display = 'block';
        btn.innerHTML = 'Create Free Account';
        btn.disabled = false;
      }
    } catch (err) {
      errEl.textContent = 'Connection error. Please try again.';
      errEl.style.display = 'block';
      btn.innerHTML = 'Create Free Account';
      btn.disabled = false;
    }
  });

  // Partner invite link (/join/CODE): free Partner account.
  const inviteCode = new URLSearchParams(location.search).get('invite');
  if (inviteCode && inviteCode !== 'expired') {
    fetch('/api/invites/' + encodeURIComponent(inviteCode)).then(r => r.json()).then(d => {
      if (!d.valid) return;
      document.getElementById('trialBadge').textContent = 'Free Partner Account';
      document.getElementById('trialInfo').style.display = 'none';
      const p = document.getElementById('partnerInfo');
      p.style.display = 'block';
      p.innerHTML = '✅ Free unlimited hail reports, hail maps and storm playback<br>✅ Portfolio and territory alerts<br>✅ No credit card, no contract' + (d.label ? '<br><span style="color:var(--muted)">' + d.label.replace(/[<>&]/g, '') + '</span>' : '');
    }).catch(() => {});
  } else if (inviteCode === 'expired') {
    const e = document.getElementById('errorMsg');
    e.textContent = 'That invite link has expired or reached its limit. You can still start a free trial below.';
    e.style.display = 'block';
  }
</script>
</body>
</html>
